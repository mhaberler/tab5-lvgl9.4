; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000
debug_init_break = tbreak setup
build_type = debug
; lib_compat_mode = strict
lib_ignore = ESPAsyncWebServer AsyncTCP

[credentials]
wifi_ssids =
	-DSSID1=\"${sysenv.WIFI_SSID}\"
	-DPW1=\"${sysenv.WIFI_PASSWORD}\"
	-DSSID2=\"${sysenv.WIFI_SSID1}\"
	-DPW2=\"${sysenv.WIFI_PASSWORD1}\"
	-DSSID3=\"${sysenv.WIFI_SSID2}\"
	-DPW3=\"${sysenv.WIFI_PASSWORD2}\"
	-DSSID4=\"${sysenv.WIFI_SSID3}\"
	-DPW4=\"${sysenv.WIFI_PASSWORD3}\"
	-DSSID5=\"${sysenv.WIFI_SSID6}\"
	-DPW5=\"${sysenv.WIFI_PASSWORD6}\"
	-DSSID6=\"${sysenv.WIFI_SSID9}\"
	-DPW6=\"${sysenv.WIFI_PASSWORD9}\"

[m5unified]
libs =
    https://github.com/M5Stack/M5Unified.git ; #develop
    https://github.com/M5Stack/M5GFX.git

[lvgl]
libs =
    https://github.com/lvgl/lvgl#v9.5.0


[other]
libs =
	https://github.com/mlesniew/PicoMQTT
	https://github.com/mlesniew/PicoWebsocket#fix_subprotocol_header_handling
	https://github.com/bblanchon/ArduinoJson
    https://github.com/stm32duino/LPS22DF.git
    https://github.com/Infineon/arduino-xensiv-dps3xx.git
    https://github.com/adafruit/Adafruit_BMP5xx.git
    https://github.com/adafruit/Adafruit_INA228.git
    ; https://github.com/mhaberler/esp-fs-webserver.git#mah-3.2.0
    https://github.com/mhaberler/BTHomeDecoder#arduino-lib
	https://github.com/mhaberler/runningstats.git
	https://github.com/ayushsharma82/ElegantOTA.git#3.1.7
	https://github.com/RileyCornelius/FmtLib
	https://github.com/bblanchon/StreamUtils


[common]
flags =
	-g -O2
    -w
    -DARDUINO_LOOP_STACK_SIZE=16384
	-DPICOWEBSOCKET_MAX_HTTP_LINE_LENGTH=512
	-DCORE_DEBUG_LEVEL=4
	-DLOG_LEVEL=5
    -DMQTT_PORT=1883
    -DMQTTWS_PORT=8883
    -DHOSTNAME=\"picomqtt\"
	-UESP_FS_WEBSERVER
	-UUSE_BLESCANNER
	-DUSE_I2C_SENSORS
	-DUSE_ELEGANT_OTA
	-DEMBEDDED_TELEPLOT

;lvgl UI
[env:m5stack-tab5-p4]
board = m5stack-tab5-p4
build_type = debug
board_build.partitions = app3M_spiffs9M_16MB.csv
debug_tool = esp-builtin
debug_init_break = tbreak setup
build_flags =
    ${common.flags}
	${credentials.wifi_ssids}
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -w
    -DHAS_DISPLAY
    -DLVGL_UI
    -DRBMEM=MALLOC_CAP_SPIRAM
    -DM5UNIFIED

lib_deps =
	${m5unified.libs}
	${lvgl.libs}
	${other.libs}

; headless
[env:m5stack-atoms3]
board = m5stack-atoms3
build_type = debug
debug_tool = esp-builtin
build_flags =
    ${common.flags}
	${credentials.wifi_ssids}
    -DRBMEM=MALLOC_CAP_DEFAULT
    -DM5UNIFIED
lib_deps =
	${m5unified.libs}
	${other.libs}

[env:m5stamp-s3]
board = m5stack-stamps3
debug_tool = esp-builtin
build_flags =
    ${common.flags}
	${credentials.wifi_ssids}
    -DRBMEM=MALLOC_CAP_DEFAULT
    -DM5UNIFIED
	-DBUILTIN_RGBLED_PIN=21
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	${m5unified.libs}
	${other.libs}

;https://www.waveshare.com/esp32-c5-wifi6-kit-n16r4.htm?srsltid=AfmBOoo-skHUZ8L4WezGhntAjR4hWqp2EAgZUN2ILSI46e4bMFcGHqhC
; rgb led on pin27
[env:esp32-c5-devkitc1-n16r8]
board = esp32-c5-devkitc1-n16r8
build_type = debug
debug_tool = esp-builtin
build_flags =
    ${common.flags}
	${credentials.wifi_ssids}
	-DBUILTIN_RGBLED_PIN=27
lib_deps =
	${other.libs}

[env:esp32p4_waveshare_devkit]
board = esp32-p4-evboard
debug_tool = esp-builtin
upload_port = /dev/cu.wchusbserial5AB01728161
board_build.partitions = app3M_spiffs9M_16MB.csv
build_flags =
    ${common.flags}
	${credentials.wifi_ssids}
lib_deps =
	${other.libs}


[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6
debug_tool = esp-builtin
build_flags =
    ${common.flags}
	${credentials.wifi_ssids}
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	${other.libs}

[env:m5stack_nanoc6]
board = m5stack_nanoc6
debug_tool = esp-builtin
board_build.partitions = huge_app.csv
build_flags =
    ${common.flags}
	${credentials.wifi_ssids}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBUTTON_PIN=GPIO_NUM_9
lib_deps =
	${other.libs}

